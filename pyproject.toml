[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "modelmeta"
version = "0.1.0"
description = "Portable, hash-linked metadata sidecars for model checkpoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "jnopareboateng" }]
keywords = ["pytorch", "checkpoints", "metadata", "integrity", "provenance", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0.3,<7",
    "rfc8785>=0.1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
]

[project.scripts]
modelmeta = "modelmeta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["modelmeta"]

[tool.hatch.build.targets.sdist]
include = [
    "modelmeta",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["modelmeta", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running acceptance tests (deselect with '-m \"not slow\"')",
]
